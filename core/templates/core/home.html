{% extends 'core/base.html' %}
{% block content %}
<section class="card intro">
  <span class="badge">총 10문제 · 제한시간 없음</span>
  <h1>안전 지식을<br>확인해 보세요.</h1>
  <p class="muted">매번 새로운 문제와 보기 순서로 연습합니다.<br>제출 후 정답과 해설을 확인할 수 있습니다.</p>
  <div class="stats"><div><strong>5</strong>난이도 하</div><div><strong>3</strong>난이도 중</div><div><strong>1</strong>난이도 상</div><div><strong>1</strong>단답형</div></div>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% if count %}<form method="post" action="{% url 'core:start' %}">{% csrf_token %}<button class="primary">문제 풀기 →</button></form>
  {% else %}<p>문제 데이터를 먼저 가져와 주세요.</p>{% endif %}
</section>
{% endblock %}
