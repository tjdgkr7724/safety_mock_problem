{% extends 'core/base.html' %}
{% block content %}<section class="card intro">
<span class="badge">제출 확인</span><h1>답안을 제출할까요?</h1><p>{{ completed }} / 10문제에 응답했습니다.</p>
{% if missing %}<p class="error">미응답 문제는 오답으로 처리됩니다.</p><div class="missing">{% for n in missing %}<a class="button" href="{% url 'core:question' attempt.pk n %}">{{ n }}번 확인</a>{% endfor %}</div>{% else %}<p class="muted">모든 문제에 응답했습니다.</p>{% endif %}
<p class="muted">최종 제출 후에는 답안을 수정할 수 없습니다.</p><div class="actions"><a class="button" href="{% url 'core:question' attempt.pk 10 %}">계속 풀기</a><form method="post" action="{% url 'core:submit' attempt.pk %}">{% csrf_token %}<button class="primary">최종 제출</button></form></div>
</section>{% endblock %}
